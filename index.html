<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Inventory Barcode Scanner</title>

  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
    }

    .container {
      max-width: 500px;
      margin: auto;
    }

    h1 {
      text-align: center;
      font-size: 25px;
      margin-bottom: 20px;
    }

    #reader {
      width: 100%;
      background: white;
      border-radius: 12px;
      overflow: hidden;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 15px;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    #scanButton {
      background: #1976d2;
      color: white;
    }

    #stopButton {
      background: #666;
      color: white;
      display: none;
    }

    .result {
      background: white;
      margin-top: 20px;
      padding: 20px;
      border-radius: 12px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #eee;
    }

    .label {
      font-weight: bold;
    }

    .value {
      text-align: right;
    }

    .barcode {
      font-size: 20px;
      font-weight: bold;
      word-break: break-all;
    }

    #status {
      text-align: center;
      margin-top: 15px;
      font-weight: bold;
    }

    .not-found {
      color: #d32f2f;
    }

    .success {
      color: #2e7d32;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>📦 Inventory Barcode Scanner</h1>

  <div id="reader"></div>

  <button id="scanButton" onclick="startScanner()">
    📷 Scan Barcode
  </button>

  <button id="stopButton" onclick="stopScanner()">
    Stop Camera
  </button>

  <div id="status"></div>

  <div class="result">

    <div class="row">
      <div class="label">Barcode</div>
      <div class="value barcode" id="barcode">—</div>
    </div>

    <div class="row">
      <div class="label">Product</div>
      <div class="value" id="productName">—</div>
    </div>

    <div class="row">
      <div class="label">Category</div>
      <div class="value" id="category">—</div>
    </div>

    <div class="row">
      <div class="label">Opening Stock</div>
      <div class="value" id="openingStock">—</div>
    </div>

    <div class="row">
      <div class="label">Reorder Level</div>
      <div class="value" id="reorderLevel">—</div>
    </div>

  </div>

</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbwF6FKjfZ4vjc_k0HD-I5cHtzM1jLOo-kGtLvNZbVMjUn3ioIrA6pBoSxdxCD31dsQ/exec";

let scanner = null;
let scanning = false;


/* =========================
   START BARCODE SCANNER
   ========================= */

function startScanner() {

  if (scanning) {
    return;
  }

  document.getElementById("status").innerText =
    "Starting camera...";

  scanner = new Html5Qrcode("reader");

  const config = {
    fps: 10,
    qrbox: {
      width: 280,
      height: 160
    },
    aspectRatio: 1.7777778
  };

  scanner.start(
    {
      facingMode: "environment"
    },
    config,

    function(decodedText, decodedResult) {

      document.getElementById("barcode").innerText =
        decodedText;

      stopScanner();

      findProduct(decodedText);

    },

    function(errorMessage) {
      // Ignore continuous scanning errors
    }

  ).then(function() {

    scanning = true;

    document.getElementById("scanButton").style.display =
      "none";

    document.getElementById("stopButton").style.display =
      "block";

    document.getElementById("status").innerText =
      "Point the camera at a barcode";

  }).catch(function(error) {

    document.getElementById("status").innerText =
      "Camera error: " + error;

  });

}


/* =========================
   STOP SCANNER
   ========================= */

function stopScanner() {

  if (!scanner || !scanning) {
    return;
  }

  scanner.stop().then(function() {

    scanner.clear();

    scanning = false;

    document.getElementById("scanButton").style.display =
      "block";

    document.getElementById("stopButton").style.display =
      "none";

  }).catch(function(error) {

    console.log(error);

  });

}


/* =========================
   FIND PRODUCT IN GOOGLE SHEET
   ========================= */

function findProduct(barcode) {

  document.getElementById("status").innerText =
    "🔍 Searching inventory...";

  document.getElementById("status").className = "";

  const callbackName =
    "inventoryCallback_" + Date.now();

  window[callbackName] = function(data) {

    try {

      if (data.success && data.found) {

        document.getElementById("productName").innerText =
          data.productName || "—";

        document.getElementById("category").innerText =
          data.category || "—";

        document.getElementById("openingStock").innerText =
          data.openingStock ?? "0";

        document.getElementById("reorderLevel").innerText =
          data.reorderLevel ?? "0";

        document.getElementById("status").innerText =
          "✅ Product Found";

        document.getElementById("status").className =
          "success";

      } else {

        document.getElementById("productName").innerText =
          "Not Found";

        document.getElementById("category").innerText =
          "—";

        document.getElementById("openingStock").innerText =
          "—";

        document.getElementById("reorderLevel").innerText =
          "—";

        document.getElementById("status").innerText =
          "❌ Product not found in inventory";

        document.getElementById("status").className =
          "not-found";

      }

    } finally {

      delete window[callbackName];
      script.remove();

    }

  };


  const script = document.createElement("script");

  script.src =
    API_URL +
    "?barcode=" +
    encodeURIComponent(barcode) +
    "&callback=" +
    callbackName;

  script.onerror = function() {

    document.getElementById("status").innerText =
      "❌ Unable to connect to Google Sheets";

    document.getElementById("status").className =
      "not-found";

    delete window[callbackName];

    script.remove();

  };

  document.body.appendChild(script);

}

</script>

</body>
</html>
