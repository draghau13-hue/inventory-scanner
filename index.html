<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Barcode Test</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f4f6f8;
      padding: 20px;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: auto;
      background: white;
      border-radius: 10px;
      overflow: hidden;
    }

    button {
      width: 100%;
      max-width: 500px;
      padding: 16px;
      margin-top: 20px;
      border: 0;
      border-radius: 10px;
      background: #1976d2;
      color: white;
      font-size: 18px;
      font-weight: bold;
    }

    #result {
      max-width: 500px;
      margin: 20px auto;
      padding: 20px;
      background: white;
      border-radius: 10px;
      font-size: 22px;
      font-weight: bold;
      word-break: break-all;
    }
  </style>
</head>

<body>

<h2>📷 Barcode Test Scanner</h2>

<div id="reader"></div>

<button onclick="startScanner()">
  Start Scanner
</button>

<div id="result">
  No barcode detected
</div>

<script>

let scanner;

function startScanner() {

  scanner = new Html5Qrcode("reader");

  scanner.start(

    {
      facingMode: "environment"
    },

    {
      fps: 10,

      qrbox: {
        width: 350,
        height: 150
      }

    },

    function(decodedText, decodedResult) {

      document.getElementById("result").innerHTML =
        "✅ BARCODE DETECTED<br><br>" +
        decodedText;

      scanner.stop();

    },

    function(errorMessage) {

      // Keep scanning

    }

  )

  .then(function() {

    document.getElementById("result").innerText =
      "📷 Camera started. Point at barcode.";

  })

  .catch(function(error) {

    document.getElementById("result").innerText =
      "Camera error: " + error;

  });

}

</script>

</body>
</html>
