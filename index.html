<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Inventory Barcode Test</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      text-align: center;
    }

    h2 {
      margin-bottom: 20px;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: auto;
      background: white;
      border-radius: 12px;
      overflow: hidden;
    }

    button {
      width: 100%;
      max-width: 500px;
      padding: 16px;
      margin-top: 20px;
      border: none;
      border-radius: 10px;
      background: #1976d2;
      color: white;
      font-size: 18px;
      font-weight: bold;
    }

    #result {
      width: 100%;
      max-width: 500px;
      margin: 20px auto;
      padding: 20px 0;
      background: white;
      border-radius: 10px;
      font-size: 20px;
      font-weight: bold;
      word-break: break-all;
    }
  </style>
</head>

<body>

<h2>📦 Inventory Barcode Scanner</h2>

<div id="reader"></div>

<button onclick="startScanner()">
  📷 Start Scanner
</button>

<div id="result">
  Ready to scan
</div>

<script>

let scanner = null;
let scanning = false;

function startScanner() {

  if (scanning) {
    return;
  }

  scanner = new Html5Qrcode("reader");

  const config = {

    fps: 15,

    qrbox: {
      width: 350,
      height: 180
    },

    formatsToSupport: [
      Html5QrcodeSupportedFormats.CODE_128,
      Html5QrcodeSupportedFormats.CODE_39
    ]

  };

  scanner.start(

    {
      facingMode: "environment"
    },

    config,

    function(decodedText, decodedResult) {

      console.log("DETECTED:", decodedText);

      document.getElementById("result").innerHTML =
        "✅ BARCODE DETECTED<br><br>" +
        decodedText;

      scanner.stop();

      scanning = false;

    },

    function(errorMessage) {

      // Continue scanning

    }

  )

  .then(function() {

    scanning = true;

    document.getElementById("result").innerText =
      "📷 Camera ready\n\nPoint at BAN412767";

  })

  .catch(function(error) {

    document.getElementById("result").innerText =
      "❌ Camera Error\n\n" + error;

  });

}

</script>

</body>
</html>
